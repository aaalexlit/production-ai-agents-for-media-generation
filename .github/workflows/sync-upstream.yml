# Keeps this fork's main branch in sync with DataTalksClub upstream.
# Uses the GitHub merge-upstream API: fast-forwards when possible,
# otherwise creates a merge commit (fork-only files such as this workflow
# and my-homework/ are preserved). Fails loudly on conflicts.
name: Sync fork with upstream

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
